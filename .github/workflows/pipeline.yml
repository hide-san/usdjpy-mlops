name: 'USD/JPY Pipeline'

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/python-setup
      - name: Buid Code
        run: echo "Nothing to build for this Python project."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/python-setup
      - name: Execute Unit Test
        run:  echo "Place code to run tests here"

  run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/python-setup
      - name: Get dataset from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle datasets download -p ./data -d hideos/daily-usdjpy-dataset --unzip
        
      - name: 'Fetch USD/JPY'
        run: python fetch.py
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}

      - name: Process data
        run: python process.py

      - name: Analyze data
        run: python analyze.py

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: data/

  kaggle:
    runs-on: ubuntu-latest
    needs: run
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/python-setup
      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ./dataset
        
      - name: Push dataset to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle datasets version -p ./dataset -m "Update dataset" --dir-mode zip
